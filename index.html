<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 인테리어 견적 시뮬레이터</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f5f3ee;color:#222}header{padding:16px 22px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}.tag{font-size:12px;background:#eee8dc;padding:7px 10px;border-radius:99px}.app{display:grid;grid-template-columns:270px 1fr 300px;min-height:calc(100vh - 66px)}aside{background:#fff;padding:18px;border-right:1px solid #ddd}.right{border-right:0;border-left:1px solid #ddd}.group{margin-bottom:18px}.group h3{font-size:13px;margin:0 0 8px;color:#666}select,input,button{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;margin-bottom:7px}button{cursor:pointer}button.active{background:#222;color:#fff}.viewer{position:relative;min-height:650px;background:linear-gradient(#dce7ed,#eee9df)}#scene{width:100%;height:100%;min-height:650px;display:block}.hint{position:absolute;left:16px;bottom:16px;background:#ffffffdd;padding:9px 12px;border-radius:8px;font-size:12px}.total{font-size:28px;font-weight:700;margin:12px 0}.line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;font-size:13px}.notice{font-size:11px;color:#777;line-height:1.5}.row{display:flex;gap:6px}.row button{flex:1}.ai{margin-top:12px;padding-top:12px;border-top:1px solid #eee}@media(max-width:900px){.app{grid-template-columns:1fr}.viewer{order:1;min-height:55vh}.left{order:2;border-right:0;border-top:1px solid #ddd}.right{order:3;border-left:0;border-top:1px solid #ddd}#scene{min-height:55vh}}</style></head><body><header><div><h1>국화아파트 604동 · 3D 인테리어 견적</h1><div style="font-size:12px;color:#777;margin-top:4px">대전 둔산동 · 테스트용 가상 평면</div></div><span class="tag">Prototype v1</span></header><main class="app"><aside class="left"><div class="group"><h3>바닥</h3><select id="floor"><option value="oak">밝은 오크</option><option value="walnut">월넛</option><option value="tile">오프화이트 타일</option></select></div><div class="group"><h3>벽</h3><select id="wall"><option value="warm">웜화이트</option><option value="gray">라이트그레이</option><option value="beige">베이지</option></select></div><div class="group"><h3>주방</h3><select id="kitchen"><option value="white">웜화이트</option><option value="wood">우드</option><option value="charcoal">차콜</option></select></div><div class="group"><h3>중문</h3><select id="door"><option value="none">없음</option><option value="black">블랙 프레임</option><option value="wood">우드 프레임</option></select></div><div class="group"><h3>조명</h3><div class="row"><button id="day" class="active">낮</button><button id="night">밤</button></div><div class="row"><button id="lightOn" class="active">조명 ON</button><button id="lightOff">조명 OFF</button></div><label style="font-size:12px">조도 <span id="brightVal">100</span>%</label><input id="brightness" type="range" min="0" max="150" value="100"><label style="font-size:12px"><input id="cove" type="checkbox" style="width:auto"> 우물천장 간접조명</label></div><div class="ai"><h3>AI 옵션 입력 테스트</h3><input id="prompt" placeholder="예: 밝은 오크, 웜화이트, 간접조명"><button id="apply">옵션 적용</button></div></aside><section class="viewer"><canvas id="scene"></canvas><div class="hint">마우스 드래그/터치: 360° 회전 · 휠/핀치: 확대·축소</div></section><aside class="right"><h3 style="margin-top:0">실시간 예상 견적</h3><div id="lines"></div><div class="line"><span>네고</span><span><input id="discount" type="number" value="0" step="100000" style="width:130px;margin:0;text-align:right"> 원</span></div><div class="total" id="total">0원</div><p class="notice">※ 테스트용 예시 단가입니다. 실제 시공 견적·구조 안전 판단 자료가 아닙니다.</p><button id="reset">기본 옵션으로 초기화</button></aside></main><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xdce7ed);const camera=new THREE.PerspectiveCamera(50,1,.1,100);camera.position.set(8,6,9);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.target.set(0,1,0);controls.minDistance=5;controls.maxDistance=18;const ambient=new THREE.AmbientLight(0xffffff,1.7);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(4,8,5);sun.castShadow=true;scene.add(sun);const room=new THREE.Group();scene.add(room);const floorMat=new THREE.MeshStandardMaterial({color:0xcba77b,roughness:.75});const wallMat=new THREE.MeshStandardMaterial({color:0xf1eee6,roughness:.9});const floor=new THREE.Mesh(new THREE.BoxGeometry(10,.15,7),floorMat);floor.position.y=-.075;floor.receiveShadow=true;room.add(floor);function box(w,h,d,x,y,z,mat=wallMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;room.add(m);return m}box(10,3,.15,0,1.5,-3.5);box(.15,3,7,-5,1.5,0);box(.15,3,7,5,1.5,0);const sofaMat=new THREE.MeshStandardMaterial({color:0xd8d1c4});box(3,.7,1.2,-1.8,.45,1.7,sofaMat);box(1.1,.65,1.1,.3,.4,1.5,sofaMat);const tableMat=new THREE.MeshStandardMaterial({color:0x7a5b43});box(2,.15,1,0,.5,.1,tableMat);box(.12,.45,.12,-.8,.25,.45,tableMat);box(.12,.45,.12,.8,.25,.45,tableMat);const kitchenMat=new THREE.MeshStandardMaterial({color:0xf1ede3});for(let i=0;i<4;i++)box(1.05,1,1.1,2.6+i*.9,.5,-2.8,kitchenMat);box(4,.12,1.2,3.3,1.06,-2.8,new THREE.MeshStandardMaterial({color:0xb9b4aa}));box(3,1.5,.08,-1.5,1.65,-3.38,new THREE.MeshStandardMaterial({color:0xb8aa96}));const doorMat=new THREE.MeshStandardMaterial({color:0x222222});const doorFrame=box(2.2,2.5,.08,2.6,1.25,2.8,doorMat);doorFrame.visible=false;const coveLight=new THREE.PointLight(0xffe0a8,0,12);coveLight.position.set(0,2.7,0);scene.add(coveLight);let lightsOn=true,isNight=false;const prices={floor:{oak:2400000,walnut:3100000,tile:4200000},wall:{warm:1800000,gray:1900000,beige:2100000},kitchen:{white:6800000,wood:7900000,charcoal:8500000},door:{none:0,black:1600000,wood:1900000},cove:2200000};const labels={floor:'바닥',wall:'벽지',kitchen:'주방',door:'중문'};const els={floor:document.querySelector('#floor'),wall:document.querySelector('#wall'),kitchen:document.querySelector('#kitchen'),door:document.querySelector('#door'),cove:document.querySelector('#cove'),brightness:document.querySelector('#brightness'),discount:document.querySelector('#discount')};function lighting(){const v=+els.brightness.value/100;if(!lightsOn){ambient.intensity=isNight?.08:.25;sun.intensity=isNight?.03:.35;coveLight.intensity=0;return}ambient.intensity=(isNight?.35:1.7)*v;sun.intensity=(isNight?.2:2.2)*v;coveLight.intensity=els.cove.checked?5*v:0}function updateMaterials(){floorMat.color.set({oak:0xcba77b,walnut:0x76523b,tile:0xe8e5df}[els.floor.value]);wallMat.color.set({warm:0xf1eee6,gray:0xd6d7d5,beige:0xd8cbb8}[els.wall.value]);kitchenMat.color.set({white:0xf1ede3,wood:0xa67b5b,charcoal:0x3e4142}[els.kitchen.value]);doorFrame.visible=els.door.value!=='none';doorMat.color.set(els.door.value==='wood'?0x8a6247:0x222222);lighting();updatePrice()}function updatePrice(){let sum=0,html='';['floor','wall','kitchen','door'].forEach(k=>{const p=prices[k][els[k].value];sum+=p;html+=`<div class="line"><span>${labels[k]}</span><strong>${p.toLocaleString()}원</strong></div>`});if(els.cove.checked){sum+=prices.cove;html+=`<div class="line"><span>우물천장/간접조명</span><strong>${prices.cove.toLocaleString()}원</strong></div>`}document.querySelector('#lines').innerHTML=html;sum=Math.max(0,sum-(+els.discount.value||0));document.querySelector('#total').textContent=sum.toLocaleString()+'원'}Object.values(els).forEach(e=>e.addEventListener('input',()=>{if(e===els.brightness)document.querySelector('#brightVal').textContent=e.value;updateMaterials()}));function setMode(night){isNight=night;scene.background=new THREE.Color(night?0x111827:0xdce7ed);document.querySelector('#day').classList.toggle('active',!night);document.querySelector('#night').classList.toggle('active',night);lighting()}document.querySelector('#day').onclick=()=>setMode(false);document.querySelector('#night').onclick=()=>setMode(true);function setLights(on){lightsOn=on;document.querySelector('#lightOn').classList.toggle('active',on);document.querySelector('#lightOff').classList.toggle('active',!on);lighting()}document.querySelector('#lightOn').onclick=()=>setLights(true);document.querySelector('#lightOff').onclick=()=>setLights(false);document.querySelector('#apply').onclick=()=>{const p=document.querySelector('#prompt').value;if(p.includes('밝은 오크'))els.floor.value='oak';if(p.includes('월넛'))els.floor.value='walnut';if(p.includes('타일'))els.floor.value='tile';if(p.includes('웜화이트')){els.wall.value='warm';els.kitchen.value='white'}if(p.includes('그레이'))els.wall.value='gray';if(p.includes('베이지'))els.wall.value='beige';if(p.includes('차콜'))els.kitchen.value='charcoal';if(p.includes('우드 주방'))els.kitchen.value='wood';if(p.includes('간접조명'))els.cove.checked=true;if(p.includes('블랙 중문'))els.door.value='black';updateMaterials()};document.querySelector('#reset').onclick=()=>{els.floor.value='oak';els.wall.value='warm';els.kitchen.value='white';els.door.value='none';els.cove.checked=false;els.discount.value=0;els.brightness.value=100;document.querySelector('#brightVal').textContent='100';setLights(true);setMode(false);updateMaterials()};function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}function loop(){resize();controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)}updateMaterials();loop();</script></body></html>
