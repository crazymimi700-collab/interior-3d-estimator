<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 인테리어 견적 시뮬레이터</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f4f3ef;color:#202020}header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}.sub{font-size:12px;color:#777;margin-top:4px}.tag{font-size:12px;background:#eee8dc;padding:7px 10px;border-radius:99px}.app{display:grid;grid-template-columns:270px 1fr 310px;min-height:calc(100vh - 65px)}aside{background:#fff;padding:18px;border-right:1px solid #ddd}.right{border-right:0;border-left:1px solid #ddd}.group{margin-bottom:17px}.group h3{font-size:13px;margin:0 0 8px;color:#666}select,input,button{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;margin-bottom:7px}button{cursor:pointer}button.active{background:#222;color:#fff}.viewer{position:relative;min-height:680px;background:linear-gradient(#dce7ed,#eee9df)}#scene{width:100%;height:100%;min-height:680px;display:block}.hint{position:absolute;left:16px;bottom:16px;background:#ffffffdf;padding:9px 12px;border-radius:8px;font-size:12px}.badge{position:absolute;right:16px;top:16px;background:#fff;padding:9px 12px;border-radius:8px;font-size:12px;box-shadow:0 2px 12px #0001}.total{font-size:28px;font-weight:700;margin:12px 0}.line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;font-size:13px}.notice{font-size:11px;color:#777;line-height:1.5}.row{display:flex;gap:6px}.row button{flex:1}.ai{margin-top:12px;padding-top:12px;border-top:1px solid #eee}@media(max-width:900px){.app{grid-template-columns:1fr}.viewer{order:1;min-height:58vh}.left{order:2;border-right:0;border-top:1px solid #ddd}.right{order:3;border-left:0;border-top:1px solid #ddd}#scene{min-height:58vh}}</style></head><body><header><div><h1>국화아파트 604동 · 3D 인테리어 견적</h1><div class="sub">대전 둔산동 · 테스트용 가상 평면 · 실제 도면 아님</div></div><span class="tag">Prototype v2 · Apartment</span></header><main class="app"><aside class="left"><div class="group"><h3>공간 보기</h3><select id="view"><option value="all">전체 평면</option><option value="living">거실·주방</option><option value="master">안방</option><option value="bath">욕실</option></select></div><div class="group"><h3>바닥</h3><select id="floor"><option value="oak">밝은 오크</option><option value="walnut">월넛</option><option value="tile">오프화이트 타일</option></select></div><div class="group"><h3>벽</h3><select id="wall"><option value="warm">웜화이트</option><option value="gray">라이트그레이</option><option value="beige">베이지</option></select></div><div class="group"><h3>주방</h3><select id="kitchen"><option value="white">웜화이트</option><option value="wood">우드</option><option value="charcoal">차콜</option></select></div><div class="group"><h3>중문</h3><select id="door"><option value="none">없음</option><option value="black">블랙 프레임</option><option value="wood">우드 프레임</option></select></div><div class="group"><h3>조명</h3><div class="row"><button id="day" class="active">낮</button><button id="night">밤</button></div><div class="row"><button id="lightOn" class="active">조명 ON</button><button id="lightOff">조명 OFF</button></div><label style="font-size:12px">조도 <span id="brightVal">100</span>%</label><input id="brightness" type="range" min="0" max="150" value="100"><label style="font-size:12px"><input id="cove" type="checkbox" style="width:auto"> 거실 우물천장·간접조명</label></div><div class="ai"><h3>AI 옵션 입력 테스트</h3><input id="prompt" placeholder="예: 밝은 오크, 웜화이트, 간접조명"><button id="apply">옵션 적용</button></div></aside><section class="viewer"><canvas id="scene"></canvas><div class="badge">거실 · 주방 · 안방 · 작은방 · 욕실 · 현관</div><div class="hint">드래그/터치: 360° 회전 · 휠/핀치: 확대·축소</div></section><aside class="right"><h3 style="margin-top:0">실시간 예상 견적</h3><div id="lines"></div><div class="line"><span>네고</span><span><input id="discount" type="number" value="0" step="100000" style="width:130px;margin:0;text-align:right"> 원</span></div><div class="total" id="total">0원</div><p class="notice">※ 테스트용 가상 평면과 예시 단가입니다. 실제 국화아파트 604동 도면·실측값이 아니며 구조 안전 판단 자료로 사용할 수 없습니다.</p><button id="reset">기본 옵션으로 초기화</button></aside></main><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xdce7ed);const camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(13,11,14);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.target.set(0,0.8,0);controls.minDistance=6;controls.maxDistance=28;controls.maxPolarAngle=Math.PI*.48;const ambient=new THREE.AmbientLight(0xffffff,1.65);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(8,14,9);sun.castShadow=true;scene.add(sun);const apt=new THREE.Group();scene.add(apt);const floorMat=new THREE.MeshStandardMaterial({color:0xcba77b,roughness:.72});const wallMat=new THREE.MeshStandardMaterial({color:0xf1eee6,roughness:.9});const kitchenMat=new THREE.MeshStandardMaterial({color:0xf1ede3});const darkMat=new THREE.MeshStandardMaterial({color:0x333333});const woodMat=new THREE.MeshStandardMaterial({color:0x7a5b43});const whiteMat=new THREE.MeshStandardMaterial({color:0xe4dfd5});const tileMat=new THREE.MeshStandardMaterial({color:0xd7d5cf});function box(w,h,d,x,y,z,mat=wallMat,parent=apt){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}function floorArea(w,d,x,z,mat=floorMat){return box(w,.12,d,x,-.06,z,mat)}// L-shaped apartment footprint
floorArea(12,7,-1,0);floorArea(6,5,2,-6);floorArea(4,3,-5,-5);const wallH=2.8,t=.13;// outer walls, front/open side partly removed for dollhouse view
box(12,wallH,t,-1,wallH/2,-3.5);box(6,wallH,t,2,wallH/2,-8.5);box(4,wallH,t,-5,wallH/2,-6.5);box(t,wallH,10,-7,wallH/2,-1.5);box(t,wallH,12,5,wallH/2,-2.5);box(4,wallH,t,-5,wallH/2,-3.5);// interior partitions
box(t,wallH,5,-2.2,wallH/2,-6);box(4.8,wallH,t,-4.6,wallH/2,-3.5);box(t,wallH,4,1.1,wallH/2,-6.5);box(3.9,wallH,t,3.05,wallH/2,-5.2);box(t,wallH,2.8,1.1,wallH/2,-1.7);// living sofa + rug + table
const sofa=new THREE.Group();apt.add(sofa);box(3.4,.72,1.05,-2.5,.42,1.5,whiteMat,sofa);box(.8,.55,2.2,-4,.34,.95,whiteMat,sofa);box(2.7,.03,2,-1.8,.03,.3,new THREE.MeshStandardMaterial({color:0xd8d0c5}),sofa);box(1.8,.16,.9,-1.7,.45,.25,woodMat,sofa);box(.1,.4,.1,-2.4,.23,.55,woodMat,sofa);box(.1,.4,.1,-1,.23,.55,woodMat,sofa);// TV/art wall
box(3.5,1.5,.08,-1.5,1.55,-3.38,new THREE.MeshStandardMaterial({color:0xb9aa96}));box(2.2,1.05,.05,-1.5,1.58,-3.31,darkMat);// kitchen L + island
for(let i=0;i<4;i++)box(1.05,.95,.7,1.7+i*.9,.48,-3.05,kitchenMat);box(4,.1,.82,3.05,1,-3.05,tileMat);for(let i=0;i<3;i++)box(.9,.85,.75,2+i*.82,.43,-.8,kitchenMat);box(2.6,.1,.9,2.8,.9,-.8,tileMat);// dining
box(2,.12,1.05,2.8,.72,1.3,woodMat);for(const [x,z] of [[2.05,.75],[3.55,.75],[2.05,1.85],[3.55,1.85]])box(.45,.45,.45,x,.3,z,whiteMat);// master bedroom
box(2.8,.45,2.1,-4.6,.28,-5.2,whiteMat);box(2.65,.18,.65,-4.6,.55,-5.85,new THREE.MeshStandardMaterial({color:0xc9c1b6}));box(1.6,2.2,.55,-6.55,1.1,-5.1,whiteMat);// small room
box(1.9,.45,1.1,-.4,.28,-7.4,whiteMat);box(1.6,.72,.65,.1,.36,-5.7,woodMat);// bath tiled floor + fixtures
floorArea(3.8,3.1,3,-6.85,tileMat);box(.75,.75,.75,4.15,.4,-7.5,whiteMat);box(1.25,.12,.6,2.3,.85,-8.1,whiteMat);box(.05,1.9,1.4,1.25,.95,-7.5,new THREE.MeshStandardMaterial({color:0xaad3dc,transparent:true,opacity:.42}));// entrance
floorArea(2.2,2,3.9,2.2,new THREE.MeshStandardMaterial({color:0xc9c6bf}));const doorMat=new THREE.MeshStandardMaterial({color:0x222});const doorGroup=new THREE.Group();apt.add(doorGroup);box(.09,2.35,.09,3.0,1.18,2.15,doorMat,doorGroup);box(.09,2.35,.09,4.8,1.18,2.15,doorMat,doorGroup);box(1.9,.09,.09,3.9,2.3,2.15,doorMat,doorGroup);box(.05,2.05,.05,3.9,1.15,2.15,new THREE.MeshStandardMaterial({color:0x9bc7d1,transparent:true,opacity:.3}),doorGroup);doorGroup.visible=false;// ceiling cove visual and light
const coveFrame=new THREE.Group();apt.add(coveFrame);const coveMat=new THREE.MeshStandardMaterial({color:0xf7f2e8,emissive:0xffd28a,emissiveIntensity:.2});box(6,.08,.18,-2,2.68,-.1,coveMat,coveFrame);box(6,.08,.18,-2,2.68,2.7,coveMat,coveFrame);box(.18,.08,2.8,-5,2.68,1.3,coveMat,coveFrame);box(.18,.08,2.8,1,2.68,1.3,coveMat,coveFrame);coveFrame.visible=false;const coveLight=new THREE.PointLight(0xffd7a0,0,12);coveLight.position.set(-2,2.5,1.2);scene.add(coveLight);let lightsOn=true,isNight=false;const prices={floor:{oak:4200000,walnut:5100000,tile:6200000},wall:{warm:3100000,gray:3300000,beige:3500000},kitchen:{white:7800000,wood:8900000,charcoal:9500000},door:{none:0,black:1800000,wood:2100000},cove:2400000};const labels={floor:'전체 바닥',wall:'도배·벽체 마감',kitchen:'주방',door:'현관 중문'};const els={view:document.querySelector('#view'),floor:document.querySelector('#floor'),wall:document.querySelector('#wall'),kitchen:document.querySelector('#kitchen'),door:document.querySelector('#door'),cove:document.querySelector('#cove'),brightness:document.querySelector('#brightness'),discount:document.querySelector('#discount')};function lighting(){const v=+els.brightness.value/100;if(!lightsOn){ambient.intensity=isNight?.08:.24;sun.intensity=isNight?.02:.3;coveLight.intensity=0;return}ambient.intensity=(isNight?.34:1.65)*v;sun.intensity=(isNight?.18:2.4)*v;coveLight.intensity=els.cove.checked?5*v:0}function updateMaterials(){floorMat.color.set({oak:0xcba77b,walnut:0x76523b,tile:0xe8e5df}[els.floor.value]);wallMat.color.set({warm:0xf1eee6,gray:0xd6d7d5,beige:0xd8cbb8}[els.wall.value]);kitchenMat.color.set({white:0xf1ede3,wood:0xa67b5b,charcoal:0x3e4142}[els.kitchen.value]);doorGroup.visible=els.door.value!=='none';doorMat.color.set(els.door.value==='wood'?0x8a6247:0x222222);coveFrame.visible=els.cove.checked;lighting();updatePrice()}function updatePrice(){let sum=0,html='';['floor','wall','kitchen','door'].forEach(k=>{const p=prices[k][els[k].value];sum+=p;html+=`<div class="line"><span>${labels[k]}</span><strong>${p.toLocaleString()}원</strong></div>`});if(els.cove.checked){sum+=prices.cove;html+=`<div class="line"><span>우물천장·간접조명</span><strong>${prices.cove.toLocaleString()}원</strong></div>`}document.querySelector('#lines').innerHTML=html;sum=Math.max(0,sum-(+els.discount.value||0));document.querySelector('#total').textContent=sum.toLocaleString()+'원'}function setView(v){const p={all:[[13,11,14],[0,.8,-2]],living:[[8,5,9],[-1,.8,0]],master:[[-9,5,-1],[-4.7,.8,-5.2]],bath:[[8,5,-10],[3,.7,-6.8]]}[v];camera.position.set(...p[0]);controls.target.set(...p[1]);controls.update()}els.view.addEventListener('change',()=>setView(els.view.value));[els.floor,els.wall,els.kitchen,els.door,els.cove,els.brightness,els.discount].forEach(e=>e.addEventListener('input',()=>{if(e===els.brightness)document.querySelector('#brightVal').textContent=e.value;updateMaterials()}));function setMode(night){isNight=night;scene.background=new THREE.Color(night?0x111827:0xdce7ed);document.querySelector('#day').classList.toggle('active',!night);document.querySelector('#night').classList.toggle('active',night);lighting()}document.querySelector('#day').onclick=()=>setMode(false);document.querySelector('#night').onclick=()=>setMode(true);function setLights(on){lightsOn=on;document.querySelector('#lightOn').classList.toggle('active',on);document.querySelector('#lightOff').classList.toggle('active',!on);lighting()}document.querySelector('#lightOn').onclick=()=>setLights(true);document.querySelector('#lightOff').onclick=()=>setLights(false);document.querySelector('#apply').onclick=()=>{const p=document.querySelector('#prompt').value;if(p.includes('밝은 오크'))els.floor.value='oak';if(p.includes('월넛'))els.floor.value='walnut';if(p.includes('타일'))els.floor.value='tile';if(p.includes('웜화이트')){els.wall.value='warm';els.kitchen.value='white'}if(p.includes('그레이'))els.wall.value='gray';if(p.includes('베이지'))els.wall.value='beige';if(p.includes('차콜'))els.kitchen.value='charcoal';if(p.includes('우드 주방'))els.kitchen.value='wood';if(p.includes('간접조명'))els.cove.checked=true;if(p.includes('블랙 중문'))els.door.value='black';updateMaterials()};document.querySelector('#reset').onclick=()=>{els.view.value='all';els.floor.value='oak';els.wall.value='warm';els.kitchen.value='white';els.door.value='none';els.cove.checked=false;els.discount.value=0;els.brightness.value=100;document.querySelector('#brightVal').textContent='100';setLights(true);setMode(false);setView('all');updateMaterials()};function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}function loop(){resize();controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)}updateMaterials();setView('all');loop();</script></body></html>
